name: CI Pruebas automatizadas (develop)
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
jobs:
  test_application:
    name: Ejecutar pruebas automatizadas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          echo "Iniciando pruebas automatizadas..."
          python -m pytest --rootdir . -s
          echo "Pruebas completadas."
      - name: Notify test results
        if: ${{ failure() }}
        run: |
          echo "Alerta: Algunas pruebas han fallado. Por favor, revisa los resultados."
